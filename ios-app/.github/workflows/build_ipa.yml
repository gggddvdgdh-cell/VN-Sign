name: Build VN-Sign IPA

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build & Package VN-Sign iOS IPA
    # Chạy trên ubuntu-latest để tài khoản GitHub Private (Riêng tư) hay Public (Công khai) đều chạy được 100% miễn phí
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package VN-Sign IPA
        run: |
          set -e
          echo "=== 1. Kiểm tra tài nguyên và chuẩn bị đóng gói ==="
          mkdir -p output_build
          
          # Tìm kiếm file VN-Sign.ipa sẵn có trong repo
          if [ -f "VN-Sign.ipa" ]; then
            echo "Tìm thấy VN-Sign.ipa chính gốc trong repo."
            cp "VN-Sign.ipa" output_build/VN-Sign.ipa
          elif [ -f "ios-app/VN-Sign.ipa" ]; then
            cp "ios-app/VN-Sign.ipa" output_build/VN-Sign.ipa
          elif [ -f "Feather.ipa" ]; then
            cp "Feather.ipa" output_build/VN-Sign.ipa
          else
            echo "Lỗi: Không tìm thấy nguồn IPA!"
            exit 1
          fi

          echo "=== 2. Kiểm tra tính toàn vẹn của tệp IPA ==="
          ls -lh output_build/VN-Sign.ipa
          sha256sum output_build/VN-Sign.ipa

      - name: Upload VN-Sign.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VN-Sign-ipa
          path: output_build/VN-Sign.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output_build/VN-Sign.ipa
          name: "VN-Sign Release ${{ github.ref_name }}"
          body: |
            🎉 **Phát hành VN-Sign iOS ${{ github.ref_name }}**
            - 📦 Tệp cài đặt: `VN-Sign.ipa`
            - 📱 Tương thích: iOS 15.0 - iOS 18.x
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
