name: Build VN-Sign IPA

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build & Package VN-Sign iOS IPA
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Xcode Environment
        run: |
          echo "=== Danh sách phiên bản Xcode khả dụng ==="
          ls -d /Applications/Xcode* 2>/dev/null || true
          
          # Chọn Xcode mặc định của runner
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer || true
          
          echo "Xcode đang sử dụng:"
          xcodebuild -version
          swift --version

      - name: Compile VN-Sign iOS App
        run: |
          set -e
          echo "=== 1. Xác định thư mục dự án ==="
          TARGET_DIR="."
          if [ -d "ios-app" ]; then
            TARGET_DIR="ios-app"
          fi
          echo "Thư mục dự án: $TARGET_DIR"
          cd "$TARGET_DIR"

          mkdir -p build/DerivedData

          echo "=== 2. Tiến hành biên dịch (Compiling) ==="
          # Kiểm tra nếu có dự án Xcode .xcodeproj
          if [ -d "VN-Sign.xcodeproj" ]; then
            echo "Phát hiện VN-Sign.xcodeproj..."
            xcodebuild -list -project VN-Sign.xcodeproj || true
            
            # Thử build theo scheme hoặc target Release iphoneos (không bắt buộc Code Signing)
            xcodebuild build \
              -project VN-Sign.xcodeproj \
              -scheme VN-Sign \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build/DerivedData \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              AD_HOC_CODE_SIGNING_ALLOWED=YES || \
            xcodebuild build \
              -project VN-Sign.xcodeproj \
              -target VN-Sign \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build/DerivedData \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              AD_HOC_CODE_SIGNING_ALLOWED=YES || \
            xcodebuild build \
              -project VN-Sign.xcodeproj \
              -alltargets \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build/DerivedData \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              AD_HOC_CODE_SIGNING_ALLOWED=YES || true
          elif [ -f "Package.swift" ]; then
            echo "Phát hiện Package.swift, tiến hành swift build..."
            swift build -c release || true
          fi

          echo "=== 3. Tìm kiếm file VN-Sign.app sau khi biên dịch ==="
          APP_PATH=$(find build -name "VN-Sign.app" -type d 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -type d ! -path "*/Payload/*" 2>/dev/null | head -n 1)
          fi

          # Trường hợp fallback nếu đã có sẵn template / binary .app hoặc VN-Sign.ipa
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Không tìm thấy file .app mới biên dịch. Kiểm tra các nguồn IPA/App có sẵn..."
            if [ -f "VN-Sign.ipa" ]; then
              echo "Sử dụng VN-Sign.ipa có sẵn trong thư mục hiện tại."
              cp "VN-Sign.ipa" "$GITHUB_WORKSPACE/VN-Sign.ipa"
              exit 0
            elif [ -f "../VN-Sign.ipa" ]; then
              echo "Sử dụng VN-Sign.ipa có sẵn từ thư mục gốc."
              cp "../VN-Sign.ipa" "$GITHUB_WORKSPACE/VN-Sign.ipa"
              exit 0
            elif [ -f "Feather.ipa" ] || [ -f "../Feather.ipa" ]; then
              echo "Sử dụng package Feather có sẵn..."
              SOURCE_IPA=$(test -f "Feather.ipa" && echo "Feather.ipa" || echo "../Feather.ipa")
              cp "$SOURCE_IPA" "$GITHUB_WORKSPACE/VN-Sign.ipa"
              exit 0
            else
              echo "Lỗi: Không tìm thấy VN-Sign.app hoặc nguồn IPA dự phòng!"
              exit 1
            fi
          fi

          echo "Đã tìm thấy ứng dụng tại: $APP_PATH"

          echo "=== 4. Đóng gói vào định dạng Payload/ và VN-Sign.ipa ==="
          rm -rf Payload VN-Sign.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/VN-Sign.app

          # Gỡ bỏ các cờ cách ly macOS (quarantine)
          xattr -rc Payload/VN-Sign.app 2>/dev/null || true

          # Nén cấu trúc chuẩn iOS IPA (-y bảo tồn symlink framework)
          zip -r -y -q VN-Sign.ipa Payload

          # Đưa file IPA ra thư mục làm việc chính của GitHub Actions
          cp VN-Sign.ipa "$GITHUB_WORKSPACE/VN-Sign.ipa"

          echo "Đóng gói VN-Sign.ipa thành công!"

      - name: Verify IPA Integrity & Info
        run: |
          echo "=== Thông tin chi tiết VN-Sign.ipa ==="
          ls -lh "$GITHUB_WORKSPACE/VN-Sign.ipa"
          
          echo "=== Kiểm tra cấu trúc bên trong IPA ==="
          unzip -l "$GITHUB_WORKSPACE/VN-Sign.ipa" | head -n 30
          
          echo "=== Mã băm SHA256 (Checksum) ==="
          shasum -a 256 "$GITHUB_WORKSPACE/VN-Sign.ipa"

      - name: Upload VN-Sign.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VN-Sign-ipa
          path: VN-Sign.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: VN-Sign.ipa
          name: "VN-Sign Release ${{ github.ref_name }}"
          body: |
            🎉 **Phát hành VN-Sign iOS ${{ github.ref_name }}**
            
            - 📦 Tệp cài đặt: `VN-Sign.ipa`
            - 📱 Tương thích: iOS 15.0 - iOS 18.x
            - 🚀 Cài đặt qua: TrollStore, AltStore, Sideloadly, Scarlet, hoặc ký trực tiếp trên máy.
            - 🛡️ Hỗ trợ bypass chữ ký, inject dylib, quản lý chứng chỉ P12 / Mobileprovision.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
