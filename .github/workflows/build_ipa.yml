name: Build VN-Sign IPA

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build & Package VN-Sign iOS IPA
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode Version
        run: |
          echo "=== 1. Kiểm tra các phiên bản Xcode trên máy Mac ==="
          ls -d /Applications/Xcode* || true
          
          # Ưu tiên Xcode 15 hoặc 16 có sẵn
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_15.4.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_16.app/Contents/Developer
          else
            sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          fi
          
          xcodebuild -version
          swift --version

      - name: Compile Swift Code & Build VN-Sign.app
        run: |
          set -e
          echo "=== 2. Tiến hành biên dịch mã nguồn Swift thật bằng xcodebuild ==="
          cd ios-app
          
          # Liệt kê targets và schemes để kiểm tra
          xcodebuild -project VN-Sign.xcodeproj -list || true

          # Biên dịch toàn bộ file Swift thành ARM64 iOS Binary (Release iphoneos)
          xcodebuild build \
            -project VN-Sign.xcodeproj \
            -scheme VN-Sign \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee xcodebuild.log || {
              echo "=== XCODEBUILD ERROR LOG ==="
              cat xcodebuild.log
              exit 1
            }

          echo "=== 3. Tìm file VN-Sign.app vừa biên dịch xong ==="
          BUILT_APP=$(find build/DerivedData/Build/Products -name "VN-Sign.app" -type d | head -n 1)
          
          if [ -z "$BUILT_APP" ] || [ ! -d "$BUILT_APP" ]; then
            echo "Tìm lại trong toàn bộ DerivedData..."
            BUILT_APP=$(find build/DerivedData -name "VN-Sign.app" -type d | grep "Products" | head -n 1)
          fi

          if [ -z "$BUILT_APP" ] || [ ! -d "$BUILT_APP" ]; then
            echo "Lỗi: Không tìm thấy VN-Sign.app trong DerivedData!"
            find build/DerivedData -maxdepth 5
            exit 1
          fi

          echo "Đã tìm thấy VN-Sign.app tại: $BUILT_APP"
          ls -la "$BUILT_APP"

          # KIỂM TRA BẮT BUỘC: File thực thi nhị phân Mach-O ARM64 phải tồn tại
          if [ ! -f "$BUILT_APP/VN-Sign" ]; then
            echo "CRITICAL ERROR: Tệp thực thi VN-Sign không được biên dịch vào .app!"
            echo "=== TOÀN BỘ LOG XCODEBUILD ==="
            cat xcodebuild.log
            exit 1
          fi

          echo "=== 4. Đóng gói vào cấu trúc Payload/ và tạo file VN-Sign.ipa ==="
          rm -rf Payload VN-Sign.ipa
          mkdir -p Payload
          cp -R "$BUILT_APP" Payload/VN-Sign.app

          # Gỡ bỏ các cờ cách ly của macOS
          xattr -rc Payload/VN-Sign.app || true

          # Nén cấu trúc chuẩn của Apple iOS (.ipa)
          zip -r -y "$GITHUB_WORKSPACE/VN-Sign.ipa" Payload

          echo "Biên dịch và đóng gói VN-Sign.ipa thành công 100%!"

      - name: Verify Compiled IPA
        run: |
          echo "=== Thông tin chi tiết tệp VN-Sign.ipa vừa build ==="
          ls -lh "$GITHUB_WORKSPACE/VN-Sign.ipa"
          
          echo "=== Cấu trúc bên trong VN-Sign.ipa ==="
          unzip -l "$GITHUB_WORKSPACE/VN-Sign.ipa" | head -n 30
          
          echo "=== Mã băm SHA-256 ==="
          shasum -a 256 "$GITHUB_WORKSPACE/VN-Sign.ipa"

      - name: Upload VN-Sign.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VN-Sign-ipa
          path: VN-Sign.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Upload Full Xcodebuild Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios-app/xcodebuild.log

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: VN-Sign.ipa
          tag_name: v2.5.0
          name: "VN-Sign Pro v2.5.0 (Native Swift iOS IPA)"
          body: |
            🎉 **Tệp cài đặt VN-Sign Pro v2.5.0 Native iOS (.ipa)**
            - 📦 Tệp cài đặt: `VN-Sign.ipa`
            - 📱 Biên dịch 100% Native Swift từ Xcode trên Apple Silicon (`macos-latest`).
            - 🔑 Hỗ trợ ký trực tiếp không giới hạn với chứng chỉ cá nhân `.p12`.
            - 🚀 Hỗ trợ cài đặt OTA nội bộ (`itms-services://`).
            - 🎨 Giao diện Dark Glassmorphism, Morphicons, và hình nền tùy biến.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
